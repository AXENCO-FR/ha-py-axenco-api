name: Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Run tests with coverage
        run: |
          pytest --cov=pyaxencoapi --cov-report=xml --cov-report=term

      - name: Check public model types and build distributions
        run: |
          python -m mypy
          python -m build
          python scripts/check_distribution.py dist/*.whl dist/*.tar.gz

      - name: Check the installed wheel's public types
        run: |
          python -m venv .wheel-check
          .wheel-check/bin/python -m pip install dist/*.whl mypy
          .wheel-check/bin/python -m mypy --no-incremental tests/typing/public_models.py
          .wheel-check/bin/python tests/typing/public_models.py
          .wheel-check/bin/python -m pip check

      - name: Upload coverage reports
        if: matrix.python-version == '3.14'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
